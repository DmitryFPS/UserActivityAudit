# UserActivityAudit — Commercial Server Stack (Phase 6)
# Dev: HTTP on localhost. Production mTLS — Phase 6+ hardening.

services:
  postgres:
    image: postgres:16-alpine
    container_name: useraudit-postgres
    environment:
      POSTGRES_DB: useraudit
      POSTGRES_USER: useraudit
      POSTGRES_PASSWORD: useraudit
    ports:
      - "5432:5432"
    volumes:
      - useraudit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useraudit -d useraudit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingest:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
      args:
        PROJECT: UserAudit.Ingest
    container_name: useraudit-ingest
    command: ["dotnet", "UserAudit.Ingest.dll"]
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=useraudit;Username=useraudit;Password=useraudit
      UserAudit__Storage__Path: /data/logs
    volumes:
      - ./docker/data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  escrow:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
      args:
        PROJECT: UserAudit.Escrow
    container_name: useraudit-escrow
    command: ["dotnet", "UserAudit.Escrow.dll"]
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=useraudit;Username=useraudit;Password=useraudit
      UserAudit__Vault__Path: /data/vault
      UserAudit__Admin__ApiKey: dev-admin-key-change-me
    volumes:
      - ./docker/data/vault:/data/vault
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  alerts:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
      args:
        PROJECT: UserAudit.Alerts
    container_name: useraudit-alerts
    command: ["dotnet", "UserAudit.Alerts.dll"]
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=useraudit;Username=useraudit;Password=useraudit
      UserAudit__Admin__ApiKey: dev-admin-key-change-me
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_started
    restart: unless-stopped

  portal:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
      args:
        PROJECT: UserAudit.Portal
    container_name: useraudit-portal
    command: ["dotnet", "UserAudit.Portal.dll"]
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=useraudit;Username=useraudit;Password=useraudit
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  useraudit_pg:

# Usage:
#   docker compose up -d --build
#   Portal:  http://localhost:8080
#   Ingest:  http://localhost:8081/api/v1/ingest/logs
#   Escrow:  http://localhost:8082/api/v1/escrow/public-key
#   Alerts:  http://localhost:8083/api/v1/alerts
